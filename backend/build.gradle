plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.10'
}

group = 'uptime'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('bootRun') {
    systemProperty 'spring.profiles.default', 'local'
}

repositories {
    mavenCentral()
}

def swaggerUiAssets = configurations.dependencyScope('swaggerUiAssets').get()
def swaggerUi = configurations.resolvable('swaggerUi') {
    extendsFrom(swaggerUiAssets)
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    add('swaggerUiAssets', 'org.webjars:swagger-ui:5.34.1')
}

tasks.named('processResources') {
    from(layout.projectDirectory.file('../api/openapi.yml')) {
        into 'swagger-ui'
    }
    from({ zipTree(swaggerUi.get().singleFile) }) {
        include '**/swagger-ui-bundle.js', '**/swagger-ui.css'
        eachFile { path = "swagger-ui/${name}" }
        includeEmptyDirs = false
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
